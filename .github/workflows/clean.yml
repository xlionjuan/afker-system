name: Cleanup Old Images
on:
  schedule:
    - cron: "15 7 * * 2" # Runs at 07:15, only on Tuesday.  
  workflow_dispatch:

jobs:
  delete-older-than-90:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Delete Images Older Than 90 Days
        uses: dataaxiom/ghcr-cleanup-action@ac45a8c04b1eb4b27974ca79a0a74f344c93664b # v1
        with:
          packages: afker-system
          older-than: 90 days
          delete-orphaned-images: true
          keep-n-tagged: 7
          keep-n-untagged: 7
